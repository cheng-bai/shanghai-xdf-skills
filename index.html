ument.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw()})}
function detail(id){let x=items.find(i=>i.id===id);if(!x){home();return}let url=`${base}/tree/main/${x.slug}-exam-quick-review`;app.innerHTML=`<div class="wrap detail"><a class="back" href="#catalog">← 返回全部 Skill</a><div class="detail-hero"><div><div class="eyebrow">Exam review / ${x.name}</div><h1>${x.name}试卷快评</h1><p class="detail-intro">${x.desc} 将试卷整理成便于阅读和转发的快评 PDF，也可以根据需要增加教师版。</p><div class="hero-actions"><a class="button" href="${url}" target="_blank" rel="noopener">查看 Skill 文件 ↗</a><a class="button secondary" href="#usage">查看使用方法 ↓</a></div></div><aside class="aside"><strong>开始之前</strong><p>准备试卷，并尽量提供同卷答案、解析、逐题分值和机构名称。</p><a class="button" href="${base}" target="_blank" rel="noopener">打开 GitHub 仓库 ↗</a></aside></div><div class="bodygrid"><div class="side"><a href="#about">关于这个 Skill</a><a href="#output">输出内容</a><a href="#usage">使用方法</a><a href="#source">来源与更新</a></div><div class="content"><section id="about"><h2>关于这个 Skill</h2><p>这是供 AI 使用的工作流程：先核对原卷，再整理逐题信息、制作 PDF 并检查版式。关键事实无法确认时，AI 应向使用者询问。</p></section><section id="output"><h2>你会得到什么</h2><div class="deliver"><div><b>01 / 前端快评</b><p>整卷判断、考点分布、逐题考点、难度、分值和答案摘要。</p></div><div><b>02 / 教师版</b><p>按需生成；数学另有完整逐题解析的专项规范。</p></div></div></section><section id="usage"><h2>如何使用</h2><ol><li>从 GitHub 获取完整的${x.name} Skill 目录，保留内部相对路径。</li><li>将目录放入 AI 工具支持的技能目录；不支持自动发现时，可让 AI 读取 SKILL.md 及其引用资料。</li><li>上传试卷和已有答案、解析或分值，向 AI 说明需要的版本。</li></ol><div class="code"><span id="prompt">请先读取并遵循 ${x.name}试卷快评 Skill：${base}/blob/main/${x.slug}-exam-quick-review/SKILL.md 及其引用资料，再分析我提供的试卷，输出前端快评 PDF。</span><button id="copy">复制指令</button></div><p>生成需要支持文档读取和 PDF 排版的 AI 环境。</p></section><section id="source"><h2>来源与更新</h2><p>来源：<a href="${url}" target="_blank" rel="noopener" style="color:var(--green)">GitHub / ${x.slug}-exam-quick-review ↗</a></p><p>原型内容依据公开仓库 main 分支提交 <code>26ba9b8</code> 的说明整理。当前页面不会自动同步，最新版以 GitHub 为准。</p></section></div></div></div>`;document.querySelector('#copy').onclick=async e=>{let t=document.querySelector('#prompt').textContent;try{await navigator.clipboard.writeText(t);e.target.textContent='已复制'}catch{let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();e.target.textContent='已复制'}}}

detail=function(id){if(id!=='compilation'){originalDetail(id);return}const branch='codex/math-exam-insight-compilation',url=`${base}/tree/${branch}/math-exam-insight-compilation`,skillUrl=`${base}/blob/${branch}/math-exam-insight-compilation/SKILL.md`;app.innerHTML=`<div class="wrap detail"><a class="back" href="#catalog">← 返回全部 Skill</a><div class="detail-hero"><div><div class="eyebrow">Math / Compilation & insights</div><h1>试卷洞见与分类汇编</h1><p class="detail-intro">从同年级多套数学试卷出发，先逐卷分析，再按数学任务、题型与难度分类，形成可追溯的教研洞察和教学资料。</p><div class="hero-actions"><a class="button" href="${url}" target="_blank" rel="noopener">查看 Skill 文件 ↗</a><a class="button secondary" href="#usage">查看使用方法 ↓</a></div></div><aside class="aside"><strong>开始之前</strong><p>准备有权使用的试卷、答案与解析，说明年级、范围及目标读者。</p><p>当前为待合并分支版本，合并前请从该分支获取。</p></aside></div><div class="bodygrid"><div class="side"><a href="#about">关于这个 Skill</a><a href="#output">输出内容</a><a href="#usage">使用方法</a><a href="#source">来源与更新</a></div><div class="content"><section id="about"><h2>关于这个 Skill</h2><p>建立稳定卷题编号和可追溯底稿，在原卷基础上分析考点、关键动作与难度，再按共同数学机制组织跨卷汇编。统计区分试卷、学校、题目和小问，避免混淆分母。</p><p>标签：高中数学 · 多卷汇编 · 考点分析 · 难度分层 · 分类汇编 · 教研洞察 · 来源追溯</p></section><section id="output"><h2>你会得到什么</h2><div class="deliver"><div><b>01 / 逐卷分析</b><p>原题旁的考点、关键动作及难度分析，保留来源与必要题图。</p></div><div><b>02 / 专题汇编</b><p>按数学任务、填选或解答以及基础、中档、难题组织，可按需求提供说明、图表和统计依据。</p></div></div></section><section id="usage"><h2>如何使用</h2><ol><li>从分支下载完整 Skill 目录，保留相对路径及配套资源。</li><li>交给支持 Skill 的 AI 工具读取入口与引用资料，并提供有权使用的试卷和答案。</li><li>指定年级、输出用途和格式，逐项核验题目、统计、公式与实际显示。</li></ol><div class="code"><span id="prompt">请读取并遵循 ${skillUrl} 及其引用资料，分析我提供的同年级数学试卷：先逐卷分析，再按数学任务和难度制作可追溯的分类汇编，以 Markdown 交付并说明统计依据。</span><button id="copy">复制指令</button></div></section><section id="source"><h2>来源与更新</h2><p><a href="${url}" target="_blank" rel="noopener" style="color:var(--green)">GitHub / math-exam-insight-compilation ↗</a></p><p>当前链接指向待合并分支。脚本检查不能替代数学、来源和版式核验；页面不会自动同步。</p></section></div></div></div>`;document.querySelector('#copy').onclick=async event=>{const text=document.querySelector('#prompt').textContent;try{await navigator.clipboard.writeText(text)}catch{const area=document.createElement('textarea');area.value=text;document.body.appendChild(area);area.select();document.execCommand('copy');area.remove()}event.target.textContent='已复制'}};
function route(){let hash=decodeURIComponent(location.hash);if(hash.startsWith('#skill/')){detail(hash.slice(7));window.scrollTo(0,0)}else if(['#about','#output','#usage','#source'].includes(hash)&&document.querySelector(hash)){document.querySelector(hash).scrollIntoView()}else{home();if(hash==='#catalog')requestAnimationFrame(()=>document.querySelector('#catalog').scrollIntoView())}}window.addEventListener('hashchange',route);route();
